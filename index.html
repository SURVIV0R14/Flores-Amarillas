<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Un detalle especial para ti, con flores y amor.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/flowers.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <title>Para Ti 🌸</title>
</head>

<body>
  <!-- Fondo de partículas -->
  <canvas id="particles-canvas"></canvas>

  <!-- Estrellas de fondo -->
  <div class="stars-bg" id="stars-bg"></div>

  <!-- Contenido principal -->
  <div class="main-content">
    <!-- Decoración flotante superior -->
    <div class="floating-petals" id="floating-petals"></div>

    <!-- Título animado letra por letra -->
    <div class="greetings" id="greetings">
      <span>H</span><span>o</span><span>l</span><span>a</span><span>,</span>
    </div>

    <!-- Descripción con typewriter -->
    <div class="description">
      <span id="typewriter-text"></span><span class="cursor">|</span>
    </div>

    <!-- Icono de flor decorativo -->
    <div class="flower-icon">🌸</div>

    <!-- Botón glassmorphism -->
    <div class="button-wrapper">
      <a href="flower.html" id="btn-enter" class="btn-glass">
        <span class="btn-text">Abrir tu regalo</span>
        <span class="btn-icon">✨</span>
      </a>
    </div>

    <!-- Decoración inferior -->
    <div class="bottom-decoration">
      <span>💛</span><span>🌼</span><span>💛</span>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>

</html>
